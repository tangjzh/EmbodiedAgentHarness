[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "embodied-agent-harness"
version = "0.1.0"
description = "Per-task coding-agent robotics harness and recorded reference controllers; no cross-task codebase transfer"
requires-python = ">=3.11"
dependencies = []
[project.scripts]
eca = "eca.cli:main"
[tool.setuptools]
packages = ["eca"]
